    <!-- 空 favicon：避免瀏覽器抓不到圖示而顯示文字字母 -->

      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      <div class="hal-frame">
        <img class="hal-img" alt="" decoding="async" />

      </div>
